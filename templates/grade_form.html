{% extends "base.html" %}
{% block content %}
<section class="form-panel">
  <h1>Add GPA Entry</h1>
  <form method="post" class="form-card">
    <label>Course name</label>
    <input type="text" name="course" placeholder="e.g. Calculus" required />

    <label>Credit hours</label>
    <input type="number" step="0.5" min="0.5" name="credits" placeholder="3" required />

    <label>Grade</label>
    <select name="grade" required>
      <option value="">Select a grade</option>
      {% for value in ['A+', 'A', 'A-', 'B+', 'B', 'B-', 'C+', 'C', 'C-', 'D+', 'D', 'F'] %}
      <option value="{{ value }}">{{ value }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="primary-button">Save grade</button>
  </form>
</section>
{% endblock %}
